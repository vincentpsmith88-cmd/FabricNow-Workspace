<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#777;background:radial-gradient(circle at 50% 35%,#fff 0,#fbfbf9 48%,#f4f3f0 100%);font-size:12px;letter-spacing:.02em}
#err{position:fixed;left:18px;right:18px;bottom:18px;padding:12px 14px;border:1px solid #ead8d8;background:rgba(255,249,249,.96);color:#8b4d4d;border-radius:10px;font-size:11px;display:none}
</style>
<script type="importmap">{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}</script>
</head>
<body>
<div id="loading">Loading fitting avatar…</div><div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const src = params.get('src') || '/models/fabricnow-genesis9-female.fbx';
const angle = Number(params.get('angle') || 0) * Math.PI / 180;
const scale = Number(params.get('scale') || 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfafaf8);

const camera = new THREE.PerspectiveCamera(27, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(0, 1.15, 3.25);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0xe7e3dc, 2.0); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 3.0); key.position.set(2.5,4.5,3.5); scene.add(key);
const fill = new THREE.DirectionalLight(0xf4f1ed, 1.2); fill.position.set(-3,2,1); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.3); rim.position.set(0,3,-4); scene.add(rim);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(1.25, 96),
  new THREE.MeshBasicMaterial({color:0xe9e7e2, transparent:true, opacity:.22, depthWrite:false})
);
floor.rotation.x = -Math.PI/2; floor.position.y = 0; scene.add(floor);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 1.2;
controls.maxDistance = 7;
controls.minPolarAngle = Math.PI * .30;
controls.maxPolarAngle = Math.PI * .62;
controls.target.set(0,1.05,0);

function normalizeModel(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x,size.y,size.z) || 1;
  const base = 1.72 / maxDim;
  obj.scale.multiplyScalar(base * scale);
  const b2 = new THREE.Box3().setFromObject(obj);
  const c2 = b2.getCenter(new THREE.Vector3());
  obj.position.x -= c2.x;
  obj.position.z -= c2.z;
  obj.position.y -= b2.min.y;
  return obj;
}

new FBXLoader().load(src, (model)=>{
  model.traverse((child)=>{
    if(child.isMesh){
      child.castShadow = true; child.receiveShadow = true;
      if(Array.isArray(child.material)) child.material.forEach(m=>{if(m) m.needsUpdate=true});
      else if(child.material) child.material.needsUpdate=true;
    }
  });
  normalizeModel(model);
  model.rotation.y = angle;
  scene.add(model);
  document.getElementById('loading').style.display='none';
  requestAnimationFrame(()=>{
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.x,size.y,size.z) * .58;
    camera.position.set(0, center.y + size.y*.03, Math.max(2.0, radius*3.0));
    controls.target.set(center.x, center.y + size.y*.02, center.z);
    controls.update();
  });
}, undefined, (error)=>{
  const el=document.getElementById('err'); el.style.display='block';
  el.textContent='The Genesis 9 FBX could not be loaded in this browser viewer. '+(error?.message || 'Check the exported FBX and its referenced assets.');
  document.getElementById('loading').style.display='none';
});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)} tick();
</script>
</body>
</html>
